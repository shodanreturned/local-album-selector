<main class="page">
  <input
    #imageFilesInput
    type="file"
    accept=".jpg,.jpeg,image/jpeg"
    multiple
    hidden
    (change)="onFilesChosen($event)"
  />

  <header class="top-bar">
    <div class="actions">
      <button type="button" (click)="pickDirectory()" [disabled]="isLoading">
        {{ isLoading ? 'Loading...' : (supportsDirectoryPicker ? 'Choose Source Folder' : 'Choose JPG Files') }}
      </button>
      <button
        type="button"
        (click)="toggleSelectedOnly()"
        [disabled]="!allImages.length"
      >
        {{ showSelectedOnly ? 'Show All Images' : 'Show Selected Only' }}
      </button>
      <button
        *ngIf="showSelectedOnly"
        type="button"
        (click)="finaliseSelection()"
        [disabled]="isSelectingDestination || !selectedCount"
      >
        {{ isSelectingDestination ? 'Copying...' : 'Finalise' }}
      </button>
      <button type="button" (click)="clearSelection()" [disabled]="!selectedCount">
        Clear Selection
      </button>
    </div>
    <div class="counter">Selected: {{ selectedCount }}</div>
  </header>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  <p *ngIf="infoMessage" class="info">{{ infoMessage }}</p>
  <p class="hint">Tap to select · Long press to view fullscreen</p>

  <section class="grid-wrapper" (scroll)="onGridScroll($event)">
    <p *ngIf="!allImages.length && !isLoading" class="empty">
      {{ supportsDirectoryPicker ? 'Choose a folder to load JPG images.' : 'Choose JPG files to load images.' }}
    </p>

    <div class="grid">
      <article
        class="card"
        *ngFor="let image of filteredImages"
        [class.selected]="image.selected"
        (pointerup)="onImageTap(image)"
      >
        <span class="selected-chip" *ngIf="image.selected">Selected</span>
        <img [src]="image.url" [alt]="image.name" loading="lazy" />
        <span class="name">{{ image.name }}</span>
      </article>
    </div>
  </section>
</main>

<section class="fullscreen-overlay" *ngIf="fullscreenImageUrl" (click)="closeFullscreen()">
  <img [src]="fullscreenImageUrl" [alt]="fullscreenImageName" />
</section>
